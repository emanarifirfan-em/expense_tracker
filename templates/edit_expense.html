{% extends "base.html" %}

{% block title %}Edit Expense · Expense Tracker{% endblock %}

{% block content %}

<!-- PAGE HEAD -->
<div class="page-head">
    <div>
        <h1 class="page-title">Edit Expense</h1>
        <p class="page-subtitle">Update the details of this transaction.</p>
    </div>
</div>

<!-- FORM SECTION -->
<div class="section form-section">
    <form method="POST" action="{{ url_for('edit', expense_id=expense['id']) }}" class="expense-form">

        <!-- ROW 1: Amount + Date -->
        <div class="field-row">
            <div class="field">
                <label for="amount">Amount (Rs.)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    required
                    autofocus
                    value="{{ expense['amount'] }}">
            </div>

            <div class="field">
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                    value="{{ expense['date'] }}">
            </div>
        </div>

        <!-- ROW 2: Category -->
        <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="Food" {% if expense['category'] == 'Food' %}selected{% endif %}>Food</option>
                <option value="Bills" {% if expense['category'] == 'Bills' %}selected{% endif %}>Bills</option>
                <option value="Travel" {% if expense['category'] == 'Travel' %}selected{% endif %}>Travel</option>
                <option value="Shopping" {% if expense['category'] == 'Shopping' %}selected{% endif %}>Shopping</option>
                <option value="Health" {% if expense['category'] == 'Health' %}selected{% endif %}>Health</option>
                <option value="Other" {% if expense['category'] == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <!-- ROW 3: Note -->
        <div class="field">
            <label for="note">Note <span class="form-hint">(optional)</span></label>
            <textarea
                id="note"
                name="note"
                rows="3"
                placeholder="Add a short description...">{{ expense['note'] or '' }}</textarea>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Update Expense
            </button>
        </div>

    </form>
</div>

{% endblock %}
