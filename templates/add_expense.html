{% extends "base.html" %}

{% block title %}Add Expense · Expense Tracker{% endblock %}

{% block content %}

<!-- PAGE HEAD -->
<div class="page-head">
    <div>
        <h1 class="page-title">Add Expense</h1>
        <p class="page-subtitle">Record a new transaction to your tracker.</p>
    </div>
</div>

<!-- FORM SECTION -->
<div class="section form-section">
    <form method="POST" action="{{ url_for('add') }}" class="expense-form">

        <!-- ROW 1: Amount + Date -->
        <div class="field-row">
            <div class="field">
                <label for="amount">Amount (Rs.)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    required
                    autofocus
                    placeholder="0.00">
            </div>

            <div class="field">
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required>
            </div>
        </div>

        <!-- ROW 2: Category -->
        <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Bills">Bills</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- ROW 3: Note -->
        <div class="field">
            <label for="note">Note <span class="form-hint">(optional)</span></label>
            <textarea
                id="note"
                name="note"
                rows="3"
                placeholder="Add a short description..."></textarea>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Save Expense
            </button>
        </div>

    </form>
</div>

{% endblock %}
